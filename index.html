<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Search Dictionary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Business Search Dictionary</h1>

        <p>Search for a business term to find its definition!</p>

        <div class="buttons">

            <button onclick="showSearch()">
                Search Mode
            </button>

            <button onclick="showQuiz()">
                Quiz Mode
            </button>

            <button onclick="viewAllTerms()">
                View All Terms
            </button>

        </div>


        <!-- SEARCH MODE -->

        <div id="searchMode">

            <input
                type="text"
                id="searchBox"
                placeholder="Type a business term..."
                onkeydown="if(event.key === 'Enter') searchDictionary()"
            >

            <button onclick="searchDictionary()">
                Search
            </button>

            <div id="result"></div>

        </div>


        <!-- QUIZ MODE -->

        <div id="quizMode">

            <div id="question">
                Click "Start Quiz" to begin!
            </div>

            <div id="answers"></div>

            <div id="quizResult"></div>

            <div id="score">
                Score: 0 / 0
            </div>

            <button id="nextButton" onclick="nextQuestion()">
                Start Quiz
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
