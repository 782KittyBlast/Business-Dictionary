<!DOCTYPE html>
<html>
<head>
    <title>Business Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Business Search Dictionary</h1>
        <p>Use the dictionary to study your business terms!</p>

        <div class="buttons">
            <button onclick="showSearch()">Search Mode</button>
            <button onclick="showQuiz()">Quiz Mode</button>
        </div>

        <!-- SEARCH MODE -->
        <div id="searchMode">

            <input type="text" id="searchBox"
                   placeholder="Type a business term..."
                   onkeydown="if(event.key === 'Enter') searchDictionary()">

            <button onclick="searchDictionary()">Search</button>

            <div id="result"></div>

        </div>


        <!-- QUIZ MODE -->
        <div id="quizMode">

            <h2>Business Quiz</h2>

            <p id="question"></p>

            <div id="answers"></div>

            <p id="quizResult"></p>

            <button id="nextButton" onclick="nextQuestion()">
                Next Question
            </button>

            <p id="score"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
